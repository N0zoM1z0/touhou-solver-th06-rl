[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "touhou-solver-th06-rl"
version = "0.1.0"
description = "Wine-grounded offline-RL research agent for Touhou"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
offline = [
    "numpy>=2",
    "xgboost-cpu>=3; platform_system == 'Linux'",
    "xgboost>=3; platform_system != 'Linux'",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.setuptools.packages.find]
where = ["src"]
